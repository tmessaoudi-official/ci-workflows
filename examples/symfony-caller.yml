name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs for the same branch when a new push arrives.
# This prevents multiple CI runs queuing up during rapid development.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Symfony CI
    uses: your-username/ci-workflows/.github/workflows/symfony.yml@v1
    with:
      php-version: '8.4'
      phpstan-level: 8
      # Only run mutation testing on the main branch (it's slow)
      run-mutation: ${{ github.ref == 'refs/heads/main' }}
    secrets:
      # Pass your private Packagist or GitHub token if you have private packages
      COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

  security:
    name: Security scan
    uses: your-username/ci-workflows/.github/workflows/security-scan.yml@v1
    needs: [ci]
    with:
      trivy-severity: 'CRITICAL,HIGH'

  docker:
    name: Docker build
    uses: your-username/ci-workflows/.github/workflows/docker-build.yml@v1
    needs: [ci]
    with:
      image-name: ${{ github.repository }}  # e.g. my-org/my-symfony-app
      # Only push to the registry when merging to main
      push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    secrets:
      # GITHUB_TOKEN is automatically provided by GitHub — no manual setup needed for GHCR
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
