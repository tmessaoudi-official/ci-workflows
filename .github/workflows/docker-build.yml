name: Docker Build and Push

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Name of the Docker image (without registry prefix), e.g. my-org/my-app'
        type: string
        required: true
      dockerfile:
        description: 'Path to the Dockerfile'
        type: string
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        default: '.'
      push:
        description: 'Whether to push the built image to the registry'
        type: boolean
        default: false
      registry:
        description: 'Container registry to push to'
        type: string
        default: 'ghcr.io'
      platforms:
        description: 'Comma-separated list of target platforms (e.g. linux/amd64,linux/arm64)'
        type: string
        default: 'linux/amd64'
    secrets:
      REGISTRY_TOKEN:
        description: 'Token for authenticating to the container registry (GITHUB_TOKEN works for GHCR)'
        required: false
    outputs:
      image-digest:
        description: 'Digest of the built image (sha256:...)'
        value: ${{ jobs.build.outputs.digest }}
      image-metadata:
        description: 'JSON metadata for the built image'
        value: ${{ jobs.build.outputs.metadata }}

permissions:
  contents: read

jobs:
  build:
    name: Build${{ inputs.push && ' and push' || '' }} Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to GHCR
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      metadata: ${{ steps.build-push.outputs.metadata }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.registry }}/${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: ${{ inputs.push }}
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build${{ inputs.push && ' and push' || '' }} image
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
