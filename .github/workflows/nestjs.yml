name: NestJS CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      package-manager:
        description: 'Node package manager to use (npm or pnpm)'
        type: string
        default: 'pnpm'
      working-directory:
        description: 'Directory containing the NestJS project (use "." for repo root)'
        type: string
        default: '.'

jobs:
  # ─────────────────────────────────────────────────────────
  # STAGE 1 — Lint and type-check (parallel)
  # ─────────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint and type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          run_install: false

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: ${{ inputs.package-manager }} run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────
  # STAGE 2 — Unit tests
  # ─────────────────────────────────────────────────────────
  test-unit:
    name: Unit tests (Jest)
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          run_install: false

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Run Jest unit tests
        run: ${{ inputs.package-manager }} run test -- --passWithNoTests

      - name: Upload unit test coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nestjs-unit
          path: ${{ inputs.working-directory }}/coverage/
          retention-days: 7
          if-no-files-found: ignore  # Coverage may not be configured in all projects

  # ─────────────────────────────────────────────────────────
  # STAGE 3 — E2E tests
  # ─────────────────────────────────────────────────────────
  test-e2e:
    name: E2E tests (Jest + PostgreSQL + Redis)
    needs: [test-unit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          run_install: false

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Run Jest E2E tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test_db
          REDIS_URL: redis://127.0.0.1:6379
          NODE_ENV: test
        run: ${{ inputs.package-manager }} run test:e2e -- --passWithNoTests

  # ─────────────────────────────────────────────────────────
  # STAGE 2 (parallel) — Production build
  # ─────────────────────────────────────────────────────────
  build:
    name: Production build
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        if: ${{ inputs.package-manager == 'pnpm' }}
        with:
          run_install: false

      - name: Set up Node.js ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}

      - name: Install dependencies (npm)
        if: ${{ inputs.package-manager == 'npm' }}
        run: npm ci

      - name: Install dependencies (pnpm)
        if: ${{ inputs.package-manager == 'pnpm' }}
        run: pnpm install --frozen-lockfile

      - name: Build NestJS application
        run: ${{ inputs.package-manager }} run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nestjs-dist
          path: ${{ inputs.working-directory }}/dist/
          if-no-files-found: error
          retention-days: 7
